[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --html=reports/test-report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/playwright
markers =
    smoke: fast, critical-path checks to run on every commit
    api: REST API functional tests
    ui: browser tests (Playwright)
    ml: machine-learning model quality and performance tests
    security: authentication, authorisation and audit-trail checks
